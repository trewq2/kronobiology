name: Deploy Tipologia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and regression tests
        run: |
          pnpm run check
          pnpm exec vitest run

      - name: Build frontend
        run: pnpm run build
      - name: Create Pages site directory
        run: |
              rm -rf _site
              mkdir -p _site
              cp -R dist/public/. _site/
              cp _site/index.html _site/404.html
              echo "--- Pages site root ---"
              ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
